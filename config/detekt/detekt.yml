# Deviations from detekt's defaults, and nothing else.
#
# `buildUponDefaultConfig` is on, so every rule not named here keeps its default. This
# file is deliberately short: a generated 700-line config would bury the handful of rules
# this project actually chose to bend, and those choices are the only part worth reviewing.
#
# Rules bent for a whole category of code live here. One-off exceptions are suppressed at
# the call site with a comment instead, so they stay visible where someone will read them.

naming:
  FunctionNaming:
    # @Composable functions are PascalCase by the official Compose naming convention.
    # Without this, detekt wants every composable in the project renamed.
    ignoreAnnotated: ['Composable']

complexity:
  LongParameterList:
    # Constructor injection lists a class's collaborators; that is the pattern working, not
    # a smell. A ViewModel that genuinely does too much is caught by reading it, not by
    # counting its parameters — CatsListViewModel's seven are all delegated to directly.
    ignoreAnnotated: ['HiltViewModel']

style:
  MagicNumber:
    # `val Purple40 = Color(0xFF6650a4)` — the property is the name, so extracting a
    # constant would just rename it twice. Same for `Migration(2, 3)`, where the numbers
    # are the schema versions, and `RoundedCornerShape(50)` behind a named `BAR_SHAPE`.
    ignorePropertyDeclaration: true

  UnusedPrivateMember:
    # @Preview composables are called by the IDE renderer, which detekt cannot see.
    # ARCHITECTURE.md §10 requires them, so deleting them is not the fix.
    ignoreAnnotated: ['Preview']
